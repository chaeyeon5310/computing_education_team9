<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f5">
  <title>집의 시간 | 지역별 시나리오 부동산 모의투자</title>
  <meta name="description" content="실제 지도·실거래 자료를 바탕으로 가상 부동산 투자 시나리오를 플레이하세요.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./styles.css">

  <!-- defer 스크립트는 문서에 나타난 순서대로 실행됩니다. 순서를 변경하지 마세요. -->
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="./src/state.js"></script>
  <script defer src="./src/market-model.js"></script>
  <script defer src="./src/finance.js"></script>
  <script defer src="./src/views.js"></script>
  <script defer src="./src/map.js"></script>
  <script defer src="./src/game.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-icon">⌂</span>
      <span>집의 시간<small>HOUSING DECISION LAB</small></span>
    </div>
    <nav>
      <span class="mode-chip">시뮬레이션 전용 · 매물 실명·위치 실제 / 거래 시나리오 가상</span>
      <button id="help-link">진행 방법</button>
      <button id="reset-link">처음부터</button>
    </nav>
  </header>

  <main id="app">
    <div class="loading-state">실제 단지 자료와 가상 시장을 준비하는 중...</div>
  </main>

  <footer class="footer">© 집의 시간 · 2020년 실거래 기준 · 이후 가상 시장 · 지도 © OpenStreetMap contributors</footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="modal">
    <div class="modal-head">
      <h3 id="dialog-title">매물 확인</h3>
      <button data-action="close-modal" onclick="document.getElementById('modal').close()" aria-label="닫기">×</button>
    </div>
    <div id="dialog-body"></div>
  </dialog>
</body>
</html>
